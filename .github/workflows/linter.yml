on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
name: Linter
jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type-aware oxlint needs generated Astro content types and Worker Env
      # bindings. Both files are gitignored; lint generates them first.
      - run: pnpm run lint
