name = "yagiz"
compatibility_date = "2026-03-21"
compatibility_flags = [ "nodejs_compat" ]
send_metrics = false
preview_urls = true
# Custom worker wraps Astro's handler for Accept negotiation + Link headers.
main = "./src/worker.ts"

[cache]
enabled = true

[placement]
mode = "smart"

[[kv_namespaces]]
binding = "SESSION"
id = "8cf89a095f9e4cb68ed74c078b642038"

[[d1_databases]]
binding = "newsletter"
database_name = "newsletter"
database_id = "33ad2d37-f48c-4033-86fd-81c7ade04178"

[assets]
binding = "ASSETS"
directory = "./dist"
not_found_handling = "404-page"
# Run the Worker before asset short-circuit so Accept negotiation can run on static HTML.
run_worker_first = true

[observability]
enabled = true

[[send_email]]
name = "email"
allowed_sender_addresses = ["contact@newsletter.yagiz.co"]
